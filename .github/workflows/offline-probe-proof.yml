name: Offline probe shipped CLI proof

on:
  push:
    branches: [proof/offline-probe-account-secrets]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout proof fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          sparse-checkout: .proof
          persist-credentials: false
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9dfef9601418cf0d93d4eab28d4ffd2db0a2f830
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Install locked dependencies
        working-directory: candidate
        run: |
          npm install --global pnpm@12.15.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the shipped runtime
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 9dfef9601418cf0d93d4eab28d4ffd2db0a2f830
          pnpm build:runtime
      - name: Run the shipped CLI against isolated account references
        run: python3 proof/.proof/offline-probe-cli.py "$GITHUB_WORKSPACE/candidate"

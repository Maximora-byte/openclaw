name: Offline probe regression proof

on:
  push:
    branches: [proof/offline-probe-account-secrets]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_VITEST_RUNTIME: node
  OPENCLAW_VITEST_WORKER_CACHE: "1"
  OPENCLAW_VITEST_FS_MODULE_CACHE: "1"
  NO_COLOR: "1"

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Install locked workspace dependencies
        run: |
          npm install --global pnpm@12.15.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Regression must fail on the unchanged production source
        shell: bash
        run: |
          set -euo pipefail
          git show 4a0ce4e8c35fdd712824e2c3d69cca949a060256:src/commands/models/list.probe.ts > src/commands/models/list.probe.ts
          set +e
          pnpm test src/commands/models/list.probe.account-secrets.test.ts --maxWorkers=1 > /tmp/probe-red.log 2>&1
          code=$?
          set -e
          cat /tmp/probe-red.log
          test "$code" -ne 0
          grep -F '"probe-account-fixture:env": "unknown"' /tmp/probe-red.log
          grep -F '"probe-account-fixture:store": "unknown"' /tmp/probe-red.log
      - name: Fixed regression and related ownership paths
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=9dfef9601418cf0d93d4eab28d4ffd2db0a2f830 -- src/commands/models/list.probe.ts
          pnpm test src/commands/models/list.probe.account-secrets.test.ts --maxWorkers=1
          pnpm test src/commands/models/list.probe.test.ts src/commands/models/list.probe.targets.test.ts src/commands/models/list.probe.resources.test.ts src/commands/models/list.probe.cleanup.test.ts src/commands/models/list.status.test.ts src/cli/capability-cli/local-account-secrets.test.ts src/gateway/server-methods/models-probe.test.ts --maxWorkers=1
      - name: Targeted static checks
        run: |
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/commands/models/list.probe.ts src/commands/models/list.probe.account-secrets.test.ts
          pnpm exec oxfmt --check src/commands/models/list.probe.ts src/commands/models/list.probe.account-secrets.test.ts
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.commands.json --incremental
          git diff --check
